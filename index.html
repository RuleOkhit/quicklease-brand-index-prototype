/* ===== arc-tokens.css ===== */
/* Arc-style design tokens for plain HTML pages and artifacts.
   Values adapted from Arc (github.com/kuratlielia/arc-library, MIT, by Elia Kuratli), registry/foundation.css.
   Paste this block at the top of the page's <style>. Components read these names only, never raw colors.
   Theme: light on bare :root; dark under prefers-color-scheme (unless data-theme="light") and again under data-theme="dark". */
:root {
  color-scheme: light;
  /* Pure grayscale ramp. No hue in the neutrals: color is saved for meaning. */
  --neutral-0: oklch(100% 0 0); --neutral-1: oklch(99% 0 0); --neutral-2: oklch(97.8% 0 0); --neutral-3: oklch(95.8% 0 0);
  --neutral-4: oklch(91.5% 0 0); --neutral-5: oklch(84% 0 0); --neutral-6: oklch(72% 0 0); --neutral-7: oklch(59% 0 0);
  --neutral-8: oklch(46% 0 0); --neutral-9: oklch(34% 0 0); --neutral-10: oklch(23% 0 0); --neutral-11: oklch(15% 0 0);

  --background: var(--neutral-0);        /* page; use --canvas behind a grid of cards */
  --canvas: oklch(97.6% 0 0);            /* app shell behind white cards */
  --surface: var(--neutral-0);           /* cards, inputs */
  --surface-raised: var(--neutral-0);    /* menus, tooltips, dialogs */
  --surface-muted: var(--neutral-2);     /* tracks, hover fills, quiet panels */
  --foreground: var(--neutral-11);
  --text-secondary: var(--neutral-8);
  --text-muted: var(--neutral-7);
  --border: oklch(93.5% 0 0);
  --border-subtle: oklch(96.5% 0 0);
  --border-strong: oklch(82% 0 0);

  /* Accent is near-black by default. Primary buttons are ink, not a brand color. */
  --accent: oklch(33% 0 0);
  --accent-strong: oklch(24% 0 0);
  --accent-subtle: oklch(33% 0 0 / .1);
  --accent-foreground: var(--background);

  /* Selection controls (switch, checkbox, slider): ink when on, white thumbs in both states. */
  --control-on: oklch(23% 0 0); --control-glyph: oklch(100% 0 0); --control-track: oklch(89.5% 0 0); --control-track-hover: oklch(86% 0 0);
  --control-thumb: oklch(100% 0 0); --control-thumb-on: oklch(100% 0 0); --control-fill: var(--control-on);
  --control-thumb-shadow: 0 0 0 .5px oklch(0% 0 0 / .07), 0 1px 2px oklch(0% 0 0 / .14), 0 2px 6px oklch(0% 0 0 / .06);

  /* Status: always paired with an icon or label. */
  --success: oklch(49% .19 150);
  --warning: oklch(58% .18 75);
  --danger: oklch(54% .21 25);

  /* Chart series. Series 1 carries the story; add more only when needed. */
  --series-1: #1f7dcf; --series-2: #7128a5; --series-3: #e58f00; --series-4: #009e84;
  --chart-ink: var(--foreground);        /* single-series lines default to ink */
  --chart-fill: color-mix(in oklab, var(--chart-ink) 9%, transparent);

  --shadow-resting: 0 1px 2px oklch(0% 0 0 / .035);
  --shadow-raised: 0 6px 18px oklch(0% 0 0 / .065), 0 1px 3px oklch(0% 0 0 / .035);
  --shadow-floating: 0 20px 48px oklch(0% 0 0 / .105), 0 3px 10px oklch(0% 0 0 / .045);

  --space-1: .25rem; --space-2: .5rem; --space-3: .75rem; --space-4: 1rem; --space-5: 1.25rem; --space-6: 1.5rem;
  --space-8: 2rem; --space-10: 2.5rem; --space-12: 3rem; --space-16: 4rem; --space-20: 5rem; --space-24: 6rem;

  --radius-control: 1.125rem;  /* 18px: buttons, inputs, segmented tracks, tables, alerts */
  --radius-panel: 1.625rem;    /* 26px: cards, menus */
  --radius-surface: 2.125rem;  /* 34px: metric cards, dialogs, hero panels */
  --radius-pill: 9999px;       /* badges, chips, delta pills */

  --control-height-sm: 2.25rem; --control-height-md: 2.75rem; --control-height-lg: 3.125rem;

  /* Geist + Inter are both on Google Fonts:
     <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"> */
  --font-display: "Geist", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --text-xs: .75rem; --text-sm: .875rem; --text-base: 1rem; --text-lg: 1.125rem; --text-xl: 1.375rem;
  --text-2xl: 1.75rem; --text-3xl: 2.25rem; --text-4xl: 3.25rem; --text-5xl: 4.5rem;
  --tracking-display: -.03em; --tracking-body: -.01em;
  --leading-display: 1.1; --leading-body: 1.4;

  --ease-enter: cubic-bezier(.16,1,.3,1);
  --ease-standard: cubic-bezier(.22,1,.36,1);
  --ease-exit: cubic-bezier(.7,0,.84,0);
  --ease-in-out: cubic-bezier(.65,0,.35,1);
  /* Spring with a gentle settle; pair with --duration-spring on transforms. */
  --ease-spring: linear(0, 0.0258, 0.09, 0.1763, 0.2732, 0.3724, 0.4683, 0.5573, 0.6376, 0.7082, 0.7689, 0.8202, 0.8628, 0.8976, 0.9256, 0.9476, 0.9648, 0.9778, 0.9875, 0.9945, 0.9994, 1.0026, 1.0047, 1.0058, 1.0062, 1.0062, 1.0059, 1.0055, 1.0049, 1.0043, 1.0036, 1.0031, 1.0025, 1.002, 1.0016, 1.0013, 1);
  --duration-instant: 120ms; --duration-fast: 160ms; --duration-standard: 240ms; --duration-considered: 480ms; --duration-spring: 580ms;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --background: oklch(19% 0 0); --canvas: oklch(17% 0 0); --surface: oklch(21.5% 0 0); --surface-raised: oklch(24% 0 0); --surface-muted: oklch(26% 0 0);
  --foreground: oklch(96% 0 0); --text-secondary: oklch(77% 0 0); --text-muted: oklch(64% 0 0);
  --border: oklch(29% 0 0); --border-subtle: oklch(25% 0 0); --border-strong: oklch(40% 0 0);
  --accent: oklch(80% 0 0); --accent-strong: oklch(91% 0 0); --accent-subtle: oklch(80% 0 0 / .13);
  --control-on: oklch(93% 0 0); --control-glyph: oklch(19% 0 0); --control-track: oklch(33% 0 0); --control-track-hover: oklch(37% 0 0); --control-thumb: oklch(97% 0 0); --control-thumb-on: oklch(19% 0 0); --control-fill: oklch(62% 0 0);
  --control-thumb-shadow: 0 0 0 .5px oklch(0% 0 0 / .3), 0 1px 2px oklch(0% 0 0 / .35), 0 2px 6px oklch(0% 0 0 / .2);
  --success: oklch(78% .18 150); --warning: oklch(83% .17 80); --danger: oklch(76% .2 25);
  --series-1: #55adff; --series-2: #9c37be; --series-3: #e66e00; --series-4: #00a861;
  --shadow-resting: 0 1px 2px oklch(0% 0 0 / .18); --shadow-raised: 0 8px 22px oklch(0% 0 0 / .22); --shadow-floating: 0 22px 55px oklch(0% 0 0 / .34);
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --background: oklch(19% 0 0); --canvas: oklch(17% 0 0); --surface: oklch(21.5% 0 0); --surface-raised: oklch(24% 0 0); --surface-muted: oklch(26% 0 0);
  --foreground: oklch(96% 0 0); --text-secondary: oklch(77% 0 0); --text-muted: oklch(64% 0 0);
  --border: oklch(29% 0 0); --border-subtle: oklch(25% 0 0); --border-strong: oklch(40% 0 0);
  --accent: oklch(80% 0 0); --accent-strong: oklch(91% 0 0); --accent-subtle: oklch(80% 0 0 / .13);
  --control-on: oklch(93% 0 0); --control-glyph: oklch(19% 0 0); --control-track: oklch(33% 0 0); --control-track-hover: oklch(37% 0 0); --control-thumb: oklch(97% 0 0); --control-thumb-on: oklch(19% 0 0); --control-fill: oklch(62% 0 0);
  --control-thumb-shadow: 0 0 0 .5px oklch(0% 0 0 / .3), 0 1px 2px oklch(0% 0 0 / .35), 0 2px 6px oklch(0% 0 0 / .2);
  --success: oklch(78% .18 150); --warning: oklch(83% .17 80); --danger: oklch(76% .2 25);
  --series-1: #55adff; --series-2: #9c37be; --series-3: #e66e00; --series-4: #00a861;
  --shadow-resting: 0 1px 2px oklch(0% 0 0 / .18); --shadow-raised: 0 8px 22px oklch(0% 0 0 / .22); --shadow-floating: 0 22px 55px oklch(0% 0 0 / .34);
}

/* Base */
*, *::before, *::after { box-sizing: border-box; }
/* Components set display (grid, flex), which beats the browser's own [hidden] rule. Without this, el.hidden = true does nothing. */
[hidden] { display: none !important; }
body { margin: 0; background: var(--background); color: var(--foreground); font-family: var(--font-body); font-size: var(--text-sm); line-height: var(--leading-body); letter-spacing: var(--tracking-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); font-weight: 500; letter-spacing: var(--tracking-display); line-height: var(--leading-display); text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
/* Keyboard focus only: pointer focus draws nothing. Text fields show focus with their border instead. */
:focus:not(:focus-visible) { outline: none; }
:focus-visible { outline: 2px solid color-mix(in oklab, var(--accent-strong) 72%, transparent); outline-offset: 2px; }
input:focus-visible, textarea:focus-visible, select:focus-visible { outline: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }

/* ===== arc-components.css ===== */
/* Arc-style component recipes for plain HTML. Requires tokens.css. Copy only what the page uses.
   Patterns adapted from Arc (github.com/kuratlielia/arc-library, MIT). Every rule reads tokens; no raw colors. */

/* ---------- App shell: quiet sidebar, canvas behind white cards ---------- */
.shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100%; background: var(--canvas); }
.sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 2px; padding: var(--space-4) var(--space-3); border-right: 1px solid var(--border); background: var(--background); }
.brand { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2); margin-bottom: var(--space-4); font-size: var(--text-base); font-weight: 600; letter-spacing: var(--tracking-body); }
.nav-item { position: relative; display: flex; height: 36px; align-items: center; gap: 10px; padding: 0 var(--space-3); border-radius: 12px; color: var(--text-secondary); font-weight: 500; text-decoration: none; transition: color var(--duration-fast) var(--ease-standard), background-color var(--duration-fast) var(--ease-standard); }
.nav-item svg { width: 18px; height: 18px; flex: none; color: var(--text-muted); }
.nav-item[aria-current="page"] { background: var(--surface-muted); color: var(--foreground); }
.nav-item[aria-current="page"] svg { color: var(--foreground); }
@media (hover: hover) and (pointer: fine) { .nav-item:hover { background: var(--surface-muted); color: var(--foreground); } }
.main { min-width: 0; padding-block: var(--space-8) var(--space-16); padding-left: max(var(--space-6), env(safe-area-inset-left, 0px)); padding-right: max(var(--space-6), env(safe-area-inset-right, 0px)); }
.page { max-width: 1120px; margin: 0 auto; display: grid; gap: var(--space-6); }

/* ---------- Page header: crumbs, display title, description, meta row ---------- */
.crumbs { display: flex; gap: 6px; align-items: center; color: var(--text-muted); font-size: var(--text-sm); }
.page-title { font-size: var(--text-3xl); }
.page-desc { max-width: 60ch; color: var(--text-secondary); font-size: var(--text-base); }
.meta-row { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--text-muted); font-size: var(--text-xs); }
.meta-row strong { color: var(--text-secondary); font-weight: 500; }

/* ---------- Card ---------- */
.card { position: relative; min-width: 0; border: 1px solid var(--border); border-radius: var(--radius-panel); background: var(--surface); padding: var(--space-6); box-shadow: var(--shadow-resting); transition: border-color var(--duration-fast) var(--ease-standard), box-shadow var(--duration-standard) var(--ease-standard); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-5); }
.card-title { font-family: var(--font-body); font-size: var(--text-base); font-weight: 500; letter-spacing: var(--tracking-body); }
.card-sub { color: var(--text-muted); font-size: var(--text-sm); }
/* Only clickable cards lift, and only for a real pointer. */
@media (hover: hover) and (pointer: fine) { .card[data-interactive]:hover { border-color: var(--border-strong); box-shadow: var(--shadow-raised); } }

/* ---------- Buttons: ink primary, outlined secondary, quiet ghost ---------- */
.btn { display: inline-flex; min-height: var(--control-height-md); align-items: center; justify-content: center; gap: var(--space-2); padding: 0 var(--space-4); border: 1px solid transparent; border-radius: var(--radius-control); font: inherit; font-size: var(--text-sm); font-weight: 500; white-space: nowrap; cursor: pointer; text-decoration: none; transition: color var(--duration-fast) var(--ease-standard), background var(--duration-fast) var(--ease-standard), border-color var(--duration-fast) var(--ease-standard), opacity var(--duration-fast) var(--ease-standard), transform var(--duration-instant) var(--ease-standard); }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn svg { width: 16px; height: 16px; }
.btn-primary { background: var(--foreground); color: var(--background); border-color: var(--foreground); }
.btn-secondary { background: var(--surface); color: var(--foreground); border-color: var(--border); }
.btn-ghost { background: transparent; color: var(--text-secondary); }
.btn-sm { min-height: var(--control-height-sm); padding-inline: var(--space-3); }
.btn:disabled { opacity: .52; cursor: not-allowed; }
@media (hover: hover) and (pointer: fine) {
  .btn-primary:hover:not(:disabled) { opacity: .91; box-shadow: var(--shadow-resting); }
  .btn-secondary:hover:not(:disabled) { background: var(--surface-muted); }
  .btn-ghost:hover:not(:disabled) { background: var(--surface-muted); color: var(--foreground); }
}

/* ---------- Badges and delta pills: tint 10%, border 25%, colored text ---------- */
.badge { display: inline-flex; min-height: 26px; align-items: center; gap: 5px; padding: 0 10px; border: 1px solid var(--b-border, var(--border)); border-radius: var(--radius-pill); background: var(--b-bg, var(--surface-muted)); color: var(--b-fg, var(--text-secondary)); font-size: var(--text-xs); font-weight: 500; line-height: 1; white-space: nowrap; }
.badge svg { width: 13px; height: 13px; color: var(--b-icon, currentColor); }
.badge-success { --b-fg: var(--success); --b-bg: color-mix(in oklab, var(--success) 10%, var(--surface)); --b-border: color-mix(in oklab, var(--success) 25%, var(--border)); }
.badge-warning { --b-fg: var(--warning); --b-bg: color-mix(in oklab, var(--warning) 11%, var(--surface)); --b-border: color-mix(in oklab, var(--warning) 27%, var(--border)); }
.badge-danger { --b-fg: var(--danger); --b-bg: color-mix(in oklab, var(--danger) 10%, var(--surface)); --b-border: color-mix(in oklab, var(--danger) 26%, var(--border)); }
.badge-outline { --b-bg: var(--surface); --b-fg: var(--text-secondary); }
.delta { display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px; border-radius: var(--radius-pill); font-size: var(--text-sm); font-weight: 500; font-variant-numeric: tabular-nums; }
.delta[data-trend="up"] { background: color-mix(in oklab, var(--success) 11%, transparent); color: var(--success); }
.delta[data-trend="down"] { background: color-mix(in oklab, var(--danger) 11%, transparent); color: var(--danger); }
.delta[data-trend="flat"] { border: 1px solid var(--border); color: var(--text-secondary); }

/* ---------- Metric: label, big number, comparison line ---------- */
.metric { display: grid; gap: var(--space-2); }
.metric-label { color: var(--text-secondary); font-size: var(--text-sm); }
.metric-value { display: inline-flex; align-items: baseline; font-family: var(--font-display); font-size: var(--text-4xl); font-weight: 500; letter-spacing: var(--tracking-display); line-height: 1; font-variant-numeric: tabular-nums; }
.metric-value .unit { margin-left: .1em; color: var(--text-muted); font-size: .5em; letter-spacing: -.01em; }
.metric-note { color: var(--text-muted); font-size: var(--text-sm); }

/* ---------- Segmented control: muted track, white chip glides under the labels ----------
   JS: on select, set track.style.setProperty('--x', btn.offsetLeft+'px') and '--w' to btn.offsetWidth+'px'. */
.seg { position: relative; display: inline-flex; max-width: 100%; gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: var(--radius-control); background: var(--surface-muted); overflow-x: auto; scrollbar-width: none; isolation: isolate; }
.seg::before { content: ""; position: absolute; z-index: -1; top: 3px; bottom: 3px; left: 0; width: var(--w, 0); transform: translateX(var(--x, 0)); border: 1px solid var(--border); border-radius: calc(var(--radius-control) - 4px); background: var(--surface); box-shadow: var(--shadow-resting); transition: transform var(--duration-spring) var(--ease-spring), width var(--duration-spring) var(--ease-spring); }
.seg button { flex: none; min-height: var(--control-height-sm); padding: 0 12px; border: 0; border-radius: calc(var(--radius-control) - 4px); background: transparent; color: var(--text-muted); font: inherit; font-size: var(--text-sm); font-weight: 500; cursor: pointer; transition: color var(--duration-fast) var(--ease-standard); }
.seg button[aria-pressed="true"] { color: var(--foreground); }
@media (hover: hover) and (pointer: fine) { .seg button:hover { color: var(--foreground); } }

/* ---------- Page tabs: plain labels, 2px accent bar under the active one ---------- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
.tab { position: relative; display: inline-flex; height: 44px; align-items: center; gap: 6px; padding: 0 10px; border: 0; background: none; color: var(--text-secondary); font: inherit; font-weight: 500; white-space: nowrap; cursor: pointer; }
.tab .count { color: var(--text-muted); font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] { color: var(--foreground); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; right: 10px; bottom: -1px; left: 10px; height: 2px; border-radius: 2px 2px 0 0; background: var(--accent); }

/* ---------- Table: rounded frame, sentence-case muted headers, airy rows ---------- */
.table-wrap { overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius-control); background: var(--surface); }
.table-scroll { overflow-x: auto; }
.table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: var(--text-sm); }
.table th { height: 44px; padding: 0 var(--space-4); border-bottom: 1px solid var(--border); color: var(--text-muted); font-weight: 500; text-align: left; white-space: nowrap; }
.table td { height: 52px; padding: 0 var(--space-4); border-bottom: 1px solid var(--border-subtle); vertical-align: middle; }
.table tbody tr:last-child td { border-bottom: 0; }
.table [data-numeric] { text-align: right; font-variant-numeric: tabular-nums; }
.table tr[data-href] { cursor: pointer; }
@media (hover: hover) and (pointer: fine) { .table tr[data-href]:hover td { background: var(--surface-muted); } }

/* ---------- List rows (activity, alerts, results): no cards, faint dividers ---------- */
.list { margin: 0; padding: 0; list-style: none; }
.list > li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 52px; padding-block: 10px; border-bottom: 1px solid var(--border-subtle); }
.list > li:last-child { border-bottom: 0; }
.list .primary-text { font-weight: 500; }
.list .secondary-text { color: var(--text-secondary); }
.list .note { color: var(--text-muted); font-size: var(--text-xs); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- Alert: white surface, only the icon carries color ---------- */
.alert { display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-4); border: 1px solid var(--border); border-radius: var(--radius-control); background: var(--surface); box-shadow: var(--shadow-resting); }
.alert > svg { width: 18px; height: 18px; flex: none; margin-top: 1px; color: var(--a-icon, var(--accent)); }
.alert-title { font-weight: 500; }
.alert-desc { margin-top: var(--space-1); color: var(--text-secondary); font-size: var(--text-xs); }
.alert-success { --a-icon: var(--success); } .alert-warning { --a-icon: var(--warning); } .alert-danger { --a-icon: var(--danger); }

/* ---------- Inputs ---------- */
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-size: var(--text-sm); font-weight: 500; }
.field .hint { color: var(--text-secondary); font-size: var(--text-sm); }
/* Full width of the field: inputs otherwise keep the browser's ~170px default and overflow narrow columns. */
.input { width: 100%; min-width: 0; height: var(--control-height-md); padding: 0 var(--space-4); border: 1px solid var(--border); border-radius: var(--radius-control); background: var(--surface); color: var(--foreground); font: inherit; transition: border-color var(--duration-fast) var(--ease-standard); }
.input:focus { outline: none; border-color: var(--border-strong); }
textarea.input { height: auto; padding: var(--space-3) var(--space-4); }

/* ---------- Meter: one hue, track is the empty space ---------- */
.meter { height: 8px; overflow: hidden; border-radius: var(--radius-pill); background: color-mix(in oklab, var(--foreground) 7%, var(--surface)); }
.meter > i { display: block; height: 100%; border-radius: inherit; background: var(--accent); }

/* ---------- Tooltip / popover: the one floating layer with a strong shadow ---------- */
.tooltip { position: fixed; z-index: 50; display: grid; gap: 4px; min-width: 140px; max-width: 240px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface-raised); box-shadow: var(--shadow-floating); color: var(--foreground); font-size: var(--text-sm); pointer-events: none; opacity: 0; scale: .96; transition: opacity var(--duration-fast) var(--ease-standard), scale var(--duration-fast) var(--ease-standard); }
.tooltip[data-open] { opacity: 1; scale: 1; }
.tooltip .tip-title { color: var(--text-secondary); font-size: var(--text-xs); }
.tooltip .tip-row { display: flex; align-items: center; gap: 8px; }
.tooltip .tip-row b { margin-left: auto; font-weight: 500; font-variant-numeric: tabular-nums; }

/* ---------- Dialog ---------- */
.overlay { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: var(--space-4); background: oklch(10% 0 0 / .46); backdrop-filter: blur(7px); }
.dialog { width: min(100%, 34rem); max-height: calc(100dvh - var(--space-8)); overflow: auto; padding: var(--space-6); border: 1px solid var(--border); border-radius: var(--radius-surface); background: var(--surface-raised); box-shadow: var(--shadow-floating); animation: dialog-in var(--duration-standard) var(--ease-enter) both; }
@keyframes dialog-in { from { opacity: 0; transform: translateY(6px) scale(.98); } }

/* ---------- Empty state ---------- */
.empty { display: grid; justify-items: center; gap: var(--space-2); padding: var(--space-12) var(--space-5); text-align: center; }
.empty-icon { display: grid; width: var(--space-12); height: var(--space-12); place-items: center; margin-bottom: var(--space-3); border: 1px solid var(--border); border-radius: var(--radius-panel); background: var(--surface-muted); color: var(--text-secondary); }
.empty h3 { font-family: var(--font-body); font-size: var(--text-base); letter-spacing: var(--tracking-body); }
.empty p { max-width: 18rem; color: var(--text-secondary); text-wrap: balance; }

/* ---------- Toast ---------- */
.toast { position: fixed; z-index: 70; left: 50%; bottom: calc(var(--space-6) + env(safe-area-inset-bottom, 0px)); display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border: 1px solid var(--border); border-radius: var(--radius-control); background: var(--surface-raised); box-shadow: var(--shadow-floating); font-size: var(--text-sm); transform: translateX(-50%); animation: toast-in var(--duration-standard) var(--ease-enter) both; }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } }

/* ---------- Entrance: items rise in sequence once; stagger 35ms per item, total under ~0.4s ---------- */
.rise { animation: rise var(--duration-considered) var(--ease-enter) both; animation-delay: calc(var(--i, 0) * 35ms); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

/* ---------- Skeleton: a calm band that breathes ---------- */
.skeleton { border-radius: 12px; background: color-mix(in oklab, var(--foreground) 6%, transparent); animation: breathe 1.4s var(--ease-in-out) infinite alternate; }
@keyframes breathe { from { opacity: .5; } to { opacity: 1; } }

/* ---------- Responsive ---------- */
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .sidebar { display: none; } /* swap for a bottom tab bar on phones */
  .main { padding-left: max(var(--space-4), env(safe-area-inset-left, 0px)); padding-right: max(var(--space-4), env(safe-area-inset-right, 0px)); }
  .page-title { font-size: var(--text-2xl); }
  .metric-value { font-size: var(--text-3xl); }
}

/* ---------- Chip group (filters): pill, check slides in when selected ---------- */
.chips { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.chip { display: inline-flex; height: var(--control-height-sm); align-items: center; gap: 6px; padding: 0 14px; border: 1px solid var(--border); border-radius: var(--radius-pill); background: var(--surface); color: var(--text-secondary); font: inherit; font-size: var(--text-sm); font-weight: 500; cursor: pointer; transition: background-color var(--duration-fast) var(--ease-standard), border-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard); }
.chip svg { width: 14px; height: 14px; display: none; color: var(--accent-strong); }
.chip[aria-pressed="true"] { border-color: color-mix(in oklab, var(--accent) 42%, var(--border)); background: color-mix(in oklab, var(--accent) 11%, var(--surface)); color: var(--foreground); }
.chip[aria-pressed="true"] svg { display: block; }
.chip:active { scale: .97; }
@media (hover: hover) and (pointer: fine) { .chip:hover { border-color: var(--border-strong); color: var(--foreground); } }

/* ---------- Switch: use <input type="checkbox" class="switch"> ---------- */
.switch { appearance: none; position: relative; flex: none; width: 42px; height: 24px; margin: 0; border-radius: var(--radius-pill); background: var(--control-track); cursor: pointer; transition: background-color var(--duration-fast) var(--ease-standard); }
.switch::before { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--control-thumb); box-shadow: var(--control-thumb-shadow); transition: transform var(--duration-spring) var(--ease-spring), background-color var(--duration-standard) var(--ease-standard); }
.switch:checked { background: var(--control-on); }
.switch:checked::before { transform: translateX(18px); background: var(--control-thumb-on); }

/* ---------- Slider: <input type="range" class="slider">; JS sets --p (0-100%) on input ---------- */
.slider { appearance: none; -webkit-appearance: none; width: 100%; height: 22px; margin: 0; background: transparent; cursor: pointer; }
.slider::-webkit-slider-runnable-track { height: 6px; border-radius: var(--radius-pill); background: linear-gradient(to right, var(--control-fill) var(--p, 50%), var(--control-track) var(--p, 50%)); }
.slider::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -8px; border: 0; border-radius: 50%; background: var(--control-thumb); box-shadow: var(--control-thumb-shadow); }
.slider::-moz-range-track { height: 6px; border-radius: var(--radius-pill); background: var(--control-track); }
.slider::-moz-range-progress { height: 6px; border-radius: var(--radius-pill); background: var(--control-fill); }
.slider::-moz-range-thumb { width: 22px; height: 22px; border: 0; border-radius: 50%; background: var(--control-thumb); box-shadow: var(--control-thumb-shadow); }

/* ===== app.css ===== */
/* QuickLease layer on top of the arc-ui tokens and components.
   Layout: quiet sidebar + sticky search bar over a pale canvas; white cards hold the content. */
html, body { height: 100%; }
body { background: var(--canvas); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--canvas); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
svg { flex: none; }

/* ---------- helpers ---------- */
.secondary { color: var(--text-secondary); } .muted { color: var(--text-muted); }
.xs { font-size: var(--text-xs); } .base { font-size: var(--text-base); }
.num { font-variant-numeric: tabular-nums; } .w5 { font-weight: 500; }
.row { display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; }
.row.nowrap { flex-wrap: nowrap; }
.stack { display: grid; gap: var(--space-3); align-content: start; }
.spacer { flex: 1; }
.link { color: var(--text-secondary); font-weight: 500; text-decoration: none; }
@media (hover: hover) and (pointer: fine) { .link:hover { color: var(--foreground); } }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-5); }
.grid-2.lead { grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); }
.grid-2.wide { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-5); }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-5); }
.card.flush { padding: var(--space-2) 0; }
.card.flush > .card-head { padding: var(--space-4) var(--space-6) 0; margin-bottom: var(--space-2); }
.card.flush > .list, .card.flush > .pad { padding: 0 var(--space-6); }
.card.tall { border-radius: var(--radius-surface); }
.card.col { display: flex; flex-direction: column; }
.divider { height: 1px; background: var(--border-subtle); }

/* ---------- shell ---------- */
.sidebar { width: 240px; }
.brand-mark { display: grid; width: 28px; height: 28px; place-items: center; border-radius: 9px; background: var(--foreground); color: var(--background); font-size: 11px; font-weight: 600; letter-spacing: 0; }
.brand small { display: block; color: var(--text-muted); font-size: var(--text-xs); font-weight: 400; }
.nav-item .count { margin-left: auto; min-width: 20px; height: 20px; display: grid; place-items: center; padding: 0 6px; border-radius: var(--radius-pill); background: color-mix(in oklab, var(--danger) 12%, var(--surface)); color: var(--danger); font-size: 11px; font-variant-numeric: tabular-nums; }
.side-foot { margin-top: auto; display: grid; gap: 4px; padding: var(--space-3); border-top: 1px solid var(--border-subtle); font-size: var(--text-xs); color: var(--text-muted); }
.side-foot b { color: var(--foreground); font-weight: 500; font-size: var(--text-sm); display: flex; align-items: center; gap: 6px; }
.side-foot b i { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }
.main { padding: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; gap: var(--space-3); align-items: center; padding-block: 12px; padding-left: max(var(--space-6), env(safe-area-inset-left, 0px)); padding-right: max(var(--space-6), env(safe-area-inset-right, 0px)); background: color-mix(in oklab, var(--canvas) 86%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid transparent; transition: border-color var(--duration-fast) var(--ease-standard); }
.topbar[data-scrolled] { border-bottom-color: var(--border); }
.view { width: 100%; max-width: 1120px; margin: 0 auto; display: grid; gap: var(--space-6); align-content: start; padding-block: var(--space-6) var(--space-20); padding-left: max(var(--space-6), env(safe-area-inset-left, 0px)); padding-right: max(var(--space-6), env(safe-area-inset-right, 0px)); }
.icon-btn { display: grid; width: 36px; height: 36px; place-items: center; border: 0; border-radius: 12px; background: none; color: var(--text-secondary); cursor: pointer; transition: background-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard); }
.icon-btn svg { width: 18px; height: 18px; }
@media (hover: hover) and (pointer: fine) { .icon-btn:hover { background: var(--surface-muted); color: var(--foreground); } }

/* ---------- search ---------- */
.search { position: relative; flex: 1; max-width: 520px; }
.search > svg { position: absolute; left: 13px; top: 50%; width: 16px; height: 16px; margin-top: -8px; color: var(--text-muted); pointer-events: none; }
.search input { width: 100%; height: var(--control-height-sm); padding: 0 40px 0 38px; border: 1px solid var(--border); border-radius: var(--radius-control); background: var(--surface); font-size: var(--text-sm); transition: border-color var(--duration-fast) var(--ease-standard); }
.search input::placeholder { color: var(--text-muted); }
.search input:focus { outline: none; border-color: var(--border-strong); }
.search .kbd { position: absolute; right: 10px; top: 50%; translate: 0 -50%; min-width: 20px; height: 20px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 6px; color: var(--text-muted); font-size: 11px; }
.search.lg input { height: var(--control-height-lg); padding-left: 44px; padding-right: 120px; font-size: var(--text-base); }
.search.lg > svg { left: 16px; width: 18px; height: 18px; margin-top: -9px; }
.search.lg .btn { position: absolute; right: 5px; top: 5px; min-height: 40px; border-radius: calc(var(--radius-control) - 4px); }
.suggest { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 30; padding: 5px; border: 1px solid var(--border); border-radius: var(--radius-panel); background: var(--surface-raised); box-shadow: var(--shadow-floating); animation: pop-in var(--duration-fast) var(--ease-enter) both; }
.suggest button { display: flex; width: 100%; min-height: 44px; align-items: center; gap: 10px; padding: 0 10px; border: 0; border-radius: calc(var(--radius-panel) - 6px); background: none; text-align: left; cursor: pointer; }
.suggest button.hi { background: var(--surface-muted); }
@media (hover: hover) and (pointer: fine) { .suggest button:hover { background: var(--surface-muted); } }
.suggest .sep { height: 1px; margin: 4px -5px; background: var(--border-subtle); }
.suggest .new { color: var(--text-secondary); }
.suggest .new svg { width: 16px; height: 16px; }
@keyframes pop-in { from { opacity: 0; transform: translateY(-4px) scale(.98); } }

/* ---------- avatars, scores ---------- */
.av { display: inline-grid; width: 32px; height: 32px; flex: none; place-items: center; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-muted); color: var(--text-secondary); font-size: 11px; font-weight: 600; letter-spacing: 0; }
.av.sm { width: 24px; height: 24px; border-radius: 8px; font-size: 9.5px; }
.av.md { width: 40px; height: 40px; border-radius: 12px; font-size: 13px; }
.av.lg { width: 48px; height: 48px; border-radius: 14px; font-size: 15px; }
.score { display: inline-flex; align-items: baseline; gap: 1px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
.score small { color: var(--text-muted); font-size: .8em; font-weight: 400; }
.score.capped { color: var(--danger); }
.score.lg { font-family: var(--font-display); font-size: var(--text-lg); letter-spacing: var(--tracking-display); }

/* ---------- page header ---------- */
.ph { display: grid; gap: var(--space-3); }
.ph .title-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3) var(--space-4); }
.ph .actions { margin-left: auto; display: flex; gap: var(--space-2); flex-wrap: wrap; }
.ph .page-desc { font-size: var(--text-base); }
.crumbs button, .crumbs a { border: 0; background: none; padding: 0; color: var(--text-muted); cursor: pointer; text-decoration: none; font-size: var(--text-sm); }
@media (hover: hover) and (pointer: fine) { .crumbs button:hover, .crumbs a:hover { color: var(--foreground); } }
.crumbs .here { color: var(--text-secondary); }
.tabs { margin-top: var(--space-2); }

/* ---------- segmented glide only animates after first placement ---------- */
.seg:not([data-ready])::before { transition: none; }
.seg button.on, .seg button[aria-pressed="true"] { color: var(--foreground); }

/* ---------- list rows ---------- */
.list > li.click { cursor: pointer; margin-inline: calc(var(--space-3) * -1); padding-inline: var(--space-3); border-radius: 14px; border-bottom-color: transparent; position: relative; }
.list > li.click::after { content: ""; position: absolute; left: var(--space-3); right: var(--space-3); bottom: 0; height: 1px; background: var(--border-subtle); }
.list > li.click:last-child::after { display: none; }
@media (hover: hover) and (pointer: fine) { .list > li.click:hover { background: var(--surface-muted); } .list > li.click:hover::after { opacity: 0; } }
.list .lead-text { min-width: 0; }
.list .lead-text > * { display: block; }
.list .end { display: flex; gap: var(--space-3); align-items: center; justify-content: flex-end; }
.sev { display: grid; width: 32px; height: 32px; place-items: center; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text-secondary); }
.sev svg { width: 16px; height: 16px; }
.sev.danger { color: var(--danger); } .sev.warning { color: var(--warning); } .sev.success { color: var(--success); }

/* ---------- alerts stack (red flags) ---------- */
.alerts { display: grid; gap: var(--space-2); }
.alert .badge { margin-left: 6px; vertical-align: 1px; }

/* ---------- pillar rows ---------- */
.pillar { display: grid; grid-template-columns: minmax(200px, 300px) minmax(0, 1fr) 44px; gap: var(--space-5); align-items: center; min-height: 60px; padding-block: 10px; border-bottom: 1px solid var(--border-subtle); }
.pillar:last-child { border-bottom: 0; }
.pillar .name { display: flex; gap: 8px; align-items: baseline; font-weight: 500; }
.pillar .name small { color: var(--text-muted); font-size: var(--text-xs); font-weight: 400; font-variant-numeric: tabular-nums; }
.pillar .why { color: var(--text-secondary); font-size: var(--text-xs); margin-top: 2px; }
.pillar .val { text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }
.pillar .val.na { color: var(--text-muted); font-weight: 400; }
.meter.na { background: repeating-linear-gradient(135deg, var(--border) 0 4px, transparent 4px 8px); }
.meter.peer { position: relative; overflow: visible; }
.meter .mark { position: absolute; top: -3px; bottom: -3px; width: 2px; border-radius: 1px; background: var(--text-muted); }

/* ---------- key/value grid ---------- */
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--space-5) var(--space-6); }
.kv > div { display: grid; gap: 4px; min-width: 0; }
.kv span { color: var(--text-secondary); font-size: var(--text-sm); }
.kv b { font-family: var(--font-display); font-size: var(--text-xl); font-weight: 500; letter-spacing: var(--tracking-display); font-variant-numeric: tabular-nums; }
.kv b.sm { font-family: var(--font-body); font-size: var(--text-base); letter-spacing: var(--tracking-body); }

/* ---------- charts ---------- */
.chart-host { position: relative; width: 100%; min-width: 0; }
.chart-host svg { display: block; overflow: visible; }
.chart-host svg text { font-family: var(--font-body); font-size: 12px; fill: var(--text-muted); font-variant-numeric: tabular-nums; letter-spacing: 0; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-bottom: var(--space-3); color: var(--text-secondary); font-size: var(--text-sm); }
.chart-legend span { display: inline-flex; align-items: center; gap: 8px; }
.chart-legend i { display: inline-block; width: 14px; height: 2.5px; border-radius: 2px; background: var(--c); }
.chart-legend i.dash { background: repeating-linear-gradient(to right, var(--c) 0 4px, transparent 4px 7px); }
.chart-legend i.dot { width: 8px; height: 8px; border-radius: 50%; }
.chart-legend i.sq { width: 10px; height: 10px; border-radius: 3px; }
.chart-host .scrub { cursor: crosshair; }
.tip { position: fixed; z-index: 80; display: grid; gap: 4px; min-width: 140px; max-width: 260px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface-raised); box-shadow: var(--shadow-floating); color: var(--foreground); font-size: var(--text-sm); line-height: var(--leading-body); pointer-events: none; }
.tip .tt { color: var(--text-secondary); font-size: var(--text-xs); }
.tip .tr { display: flex; align-items: center; gap: 8px; }
.tip .tr i { width: 10px; height: 2.5px; border-radius: 2px; background: var(--c); flex: none; }
.tip .tr span { color: var(--text-secondary); }
.tip .tr b { margin-left: auto; padding-left: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
.tip p { color: var(--text-secondary); font-size: var(--text-xs); }

/* ---------- research flow ---------- */
.options { display: grid; gap: var(--space-2); }
.option { display: flex; width: 100%; align-items: center; gap: var(--space-4); padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius-control); background: var(--surface); text-align: left; cursor: pointer; transition: border-color var(--duration-fast) var(--ease-standard), box-shadow var(--duration-standard) var(--ease-standard); }
.option .chev { width: 16px; height: 16px; color: var(--text-muted); margin-left: auto; }
.option.dashed { border-style: dashed; background: transparent; }
@media (hover: hover) and (pointer: fine) { .option:hover { border-color: var(--border-strong); box-shadow: var(--shadow-resting); } }
.steps { margin: 0; padding: 0; list-style: none; }
.steps li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: var(--space-4); padding-block: 14px; border-bottom: 1px solid var(--border-subtle); transition: opacity var(--duration-standard) var(--ease-standard); }
.steps li:last-child { border-bottom: 0; }
.steps li.wait { opacity: .45; }
.steps .st { display: grid; width: 20px; height: 20px; margin-top: 1px; place-items: center; border: 1.5px solid var(--border-strong); border-radius: 50%; color: var(--background); }
.steps li.run .st { border-color: var(--foreground); border-right-color: transparent; animation: spin .7s linear infinite; }
.steps li.done .st { border-color: var(--foreground); background: var(--foreground); }
.steps .st svg { width: 11px; height: 11px; }
.steps .facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.steps .facts .badge { animation: rise var(--duration-considered) var(--ease-enter) both; }
.badge.drop { text-decoration: line-through; color: var(--text-muted); border-style: dashed; background: transparent; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- compare ---------- */
.cmp-row { display: grid; grid-template-columns: 180px repeat(var(--n), minmax(0, 1fr)); gap: var(--space-5); align-items: center; min-height: 52px; padding-block: 10px; border-bottom: 1px solid var(--border-subtle); }
.cmp-row:last-child { border-bottom: 0; }
.cmp-row .lab { color: var(--text-secondary); }
.cmp-cell { display: grid; gap: 8px; min-width: 0; }
.cmp-cell .v { display: flex; align-items: center; gap: 6px; font-weight: 500; font-variant-numeric: tabular-nums; }
.cmp-cell .v svg { width: 14px; height: 14px; color: var(--success); }
.cmp-cell.big .v { font-family: var(--font-display); font-size: var(--text-2xl); letter-spacing: var(--tracking-display); }
.cmp-head { display: grid; gap: 10px; align-content: start; }
.select { height: var(--control-height-sm); min-width: 0; padding: 0 12px; border: 1px solid var(--border); border-radius: calc(var(--radius-control) - 4px); background: var(--surface); font-weight: 500; }
.key { width: 10px; height: 10px; border-radius: 3px; flex: none; background: var(--c); }
.verdict { padding: var(--space-4) var(--space-5); border-radius: var(--radius-control); background: var(--surface-muted); color: var(--text-secondary); }
.verdict b { color: var(--foreground); font-weight: 500; }

/* ---------- forms ---------- */
.field select.input { padding-right: 32px; }
.switch-row { display: flex; gap: var(--space-4); align-items: flex-start; justify-content: space-between; padding-block: 14px; border-bottom: 1px solid var(--border-subtle); }
.switch-row:last-child { border-bottom: 0; }
.switch-row .switch { margin-top: 2px; }
.slider-row { display: grid; gap: 6px; padding-block: 10px; }
.slider-row .head { display: flex; justify-content: space-between; gap: var(--space-3); }
.slider-row .head b { font-weight: 500; }
.slider-row .head span { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
textarea.input { min-height: 140px; resize: vertical; line-height: 1.6; }

/* ---------- misc ---------- */
.callout { padding: var(--space-4) var(--space-5); border-radius: var(--radius-control); background: var(--surface-muted); color: var(--text-secondary); }
.callout b { color: var(--foreground); font-weight: 500; }
.step-card { display: grid; gap: var(--space-2); align-content: start; }

// ---------- Scoring engine (the fixed formula) ----------
const PILLARS = [
 {k:'fin',label:'Financial strength',short:'Financial',desc:'Profit or loss, revenue growth, cash burn and funding runway, from company filings. Parent strength is shown separately.'},
 {k:'mom',label:'Momentum',short:'Momentum',desc:'Stores opened against stores closed in the last 12 months, plus new cities entered.'},

 {k:'mall',label:'Mall track record',short:'Mall record',desc:'How many malls it trades in, how long it stays, and how often it leaves early.'},
 {k:'buzz',label:'Buzz',short:'Buzz',desc:'Indian press and Instagram mentions. Weighted low because buzz is easy to buy.'}
];
const PRESETS = {
 balanced:{label:'Balanced',w:{fin:30,mom:25,cus:25,mall:15,buzz:5},note:'The default model.'},

};
const state = {
 weights: store.get('weights', {...PRESETS.balanced.w}), preset: store.get('preset','balanced'),
 ageAdjust: store.get('ageAdjust', true), caps: store.get('caps', true),
 watch: new Set(store.get('watch', TENANTS.map(t=>t.id))), compare: store.get('compare', ['kestrel','pace18']),
 researched: new Set(store.get('researched', [])), custom: store.get('custom', {})
};
function saveState(){store.set('weights',state.weights);store.set('preset',state.preset);store.set('ageAdjust',state.ageAdjust);store.set('caps',state.caps);store.set('watch',[...state.watch]);store.set('compare',state.compare);store.set('researched',[...state.researched]);store.set('custom',state.custom)}

const age = b => NOW_YEAR - b.founded;
const isYoung = b => age(b) < 5;
const isRising = b => age(b) <= 8;
function effWeights(b, W=state.weights, ageAdj=state.ageAdjust){
  const w = {...W}; const adjusted = ageAdj && isYoung(b);
  if(adjusted){ w.fin*=0.5; w.mom*=1.3; w.cus*=1.2; }
  const missing = PILLARS.filter(p=>b.p[p.k]==null).map(p=>p.k);
  missing.forEach(k=>w[k]=0);
  const sum = Object.values(w).reduce((a,c)=>a+c,0) || 1;
  PILLARS.forEach(p=>w[p.k]=w[p.k]/sum);
  return {w, adjusted, missing};
}
const CAP = {serious:5.5, critical:3.0};
function scoreOf(b, W, ageAdj, caps=state.caps){
  const {w} = effWeights(b, W, ageAdj);
  const raw = PILLARS.reduce((a,p)=>a+(b.p[p.k]??0)*w[p.k],0);
  let cap = 10, capBy = null;
  if(caps) for(const f of b.flags){ if(CAP[f.sev]!=null && CAP[f.sev]<cap){cap=CAP[f.sev];capBy=f} }
  return {score:r1(Math.min(raw,cap)), raw:r1(raw), capped: raw>cap, capBy};
}
const score = b => scoreOf(b).score;
function band(s){ if(s>=7.5) return {k:'good',label:'Strong'}; if(s>=6.3) return {k:'ok',label:'Solid'}; if(s>=5) return {k:'warn',label:'Watch'}; return {k:'risk',label:'High risk'} }
function confidence(b){
  const miss = PILLARS.filter(p=>b.p[p.k]==null).length, n = b.evidence.length;
  if((miss && b.stores<12) || n<10) return {k:'Low',cls:'warn',why:'Few sources and at least one pillar has no data.'};
  if(miss || n<16 || b.stores<12) return {k:'Medium',cls:'neutral',why: miss ? `No data for ${miss} pillar${miss>1?'s':''}, so it is left out rather than scored as zero.` : 'Small footprint, so fewer independent sources.'};
  return {k:'High',cls:'good',why:`${n} sourced facts across all five pillars.`};
}
function peerRank(b){ const peers = BRANDS.filter(x=>x.cat===b.cat && !x.closed).sort((a,c)=>score(c)-score(a)); const i = peers.indexOf(b); return {rank:i+1, of:peers.length, total:CATS[b.cat].peers} }
const fundamentals = b => { const W = {...state.weights, buzz:0}; return scoreOf(b, W).raw };

// ---------- Derived data (deterministic, from each brand's seed) ----------
const QTRS = ["Q4 '24","Q1 '25","Q2 '25","Q3 '25","Q4 '25","Q1 '26","Q2 '26","Q3 '26"];
const MONTHS = ['Nov','Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct'];
function split(total,n,R){ const parts = Array.from({length:n},()=>0.4+R()); const s = parts.reduce((a,c)=>a+c,0); const out = parts.map(p=>Math.floor(total*p/s)); let rest = total-out.reduce((a,c)=>a+c,0); for(let i=n-1;rest>0;i--,rest--) out[(i+n)%n]++; return out }
const NEWS_HOSTS = ['national business daily','business daily','startup news site','financial daily','markets daily','startup funding tracker','marketing trade site'];
function enrich(b){
  const R = rng(hash(b.id));
  // score trend offsets, ending at 0 (current)
  const off = new Array(12).fill(0); off[8] = -b.d3;
  off[9] = -b.d3*2/3 + (R()-.5)*.15; off[10] = -b.d3/3 + (R()-.5)*.15;
  for(let i=7;i>=0;i--) off[i] = off[i+1] - b.d3*0.22 + (R()-.5)*.3;
  b.trendOff = off;
  // store openings/closings per quarter
  const o = split(b.open12,4,R), c = split(b.close12,4,R);
  const oPrev = split(Math.round(b.open12*(b.d3>0?0.55:1.15)+R()*3),4,R), cPrev = split(Math.round(b.close12*(b.d3>0?1.1:0.55)+R()*2),4,R);
  b.quarters = QTRS.map((q,i)=>({q, open: i<4?oPrev[i]:o[i-4], close: i<4?cPrev[i]:c[i-4]}));
  // mall presence
  const pool = [...MALL_POOL].sort(()=>R()-.5);
  const nShow = Math.min(b.malls + Math.min(b.exits,3), 8);
  b.mallList = pool.slice(0,nShow).map(([m,city],i)=>{ const exited = i >= nShow - Math.min(b.exits,3) && b.exits>0; const since = Math.max(b.founded, NOW_YEAR - Math.max(1,Math.round(b.tenure*(0.5+R()*1.2)))); return {m,city,since,status: exited?'Exited':'Trading', left: exited ? Math.min(NOW_YEAR, since+1+Math.floor(R()*3)) : null} });
  // review volume per month (k)
  const base = Math.max(40, b.reviews/60);
  b.reviewVel = Array.from({length:12},(_,i)=>Math.round(base*(0.75+R()*0.5)*(1+(b.d3>0?i*0.03:-i*0.01))));
  if(b.id==='softstep') b.reviewVel[11] = Math.round(base*6.5);
  b.igFollowers = Math.round((b.p.buzz**3)*(800+R()*900));
  b.articles90 = Math.round(b.p.buzz*(2+R()*3));
  b.evidence = buildEvidence(b, R);
  return b;
}
function monthsAgoLabel(m){ const d = new Date(2026, 9-m, 1); return d.toLocaleString('en-GB',{month:'short',year:'numeric'}) }
function buildEvidence(b, R){
  const E = []; const site = slug(b.name)+'.in';
  const add = (type,pillar,title,host,date,fact)=>E.push({type,pillar,title,host,date,fact});
  if(b.rev!=null){
    add('Filing','fin',`${b.parent}: financial statements FY25`,'mca.gov.in','Mar 2026',`Revenue ${inr(b.rev)} · net ${b.pat<0?'loss':'profit'} ${inr(Math.abs(b.pat))}`);
    add('Filing','fin',`${b.parent}: financial statements FY24`,'mca.gov.in','Apr 2025',`Revenue ${inr(Math.round(b.rev*(0.7+R()*0.2)))}`);
  }
  if(b.parentScore) add('Exchange','fin',`${b.parent.split(' (')[0]} quarterly results, Q1 FY27`,'stock exchange filing','Aug 2026',`Parent financial strength ${b.parentScore.toFixed(1)} / 10`);
  if(b.lastRaise) add('Funding','fin',`${b.name} raises ${b.funding}`,'startup funding tracker',monthsAgoLabel(b.lastRaise),`${b.funding}, ${b.lastRaise} months ago`);
  add('Store locator','mom',`${b.name} store locator`,`${site}/stores`,'Oct 2026',`${b.stores} stores in ${b.cities} cities`);
  add('Google Maps','mom',`Google Maps listings for “${b.name}”`,'google.com/maps','Oct 2026',`${b.stores} open · ${b.close12} marked permanently closed in 12 months`);
  add('Snapshot','mom','QuickLease monthly store-count history','quicklease (internal)','Oct 2026',`+${b.open12} opened / −${b.close12} closed in 12 months`);
  add('Google reviews','cus',`Google reviews across ${b.stores||'former'} outlets`,'google.com/maps','Oct 2026',`${b.rating.toFixed(1)}★ from ${b.reviews.toLocaleString('en-IN')} reviews`);
  if(FNB.has(b.cat)) add('Zomato','cus',`${b.name} on Zomato`,'zomato.com','Oct 2026',`Dining ${(b.rating+(R()-.4)*.3).toFixed(1)}★ · ${compact(Math.round(b.reviews*.6))} ratings`);
  add('Mall directories','mall',`Mall store directories (${b.malls} malls)`,'mall websites','Sep 2026',`In ${b.malls} malls · average stay ${b.tenure.toFixed(1)} yrs · ${b.exits} exits in 3 yrs`);
  const heads = [`${b.name} plans ${Math.max(5,Math.round(b.open12*1.4))} new stores by FY27`,`${b.name} enters ${['Hyderabad','Pune','Kolkata','Chennai','Jaipur','Lucknow'][Math.floor(R()*6)]}`,`Inside ${b.name}'s retail playbook`,`${b.name} bets on malls over high streets`,`How ${b.name} is handling rising rents`,`${b.name} names new CEO for India retail`];
  const nNews = Math.max(2, Math.round(b.p.buzz/1.6));

function generateBrand(name, variant=0, commit=true){

  const R = rng(hash(id));

  const young = NOW_YEAR-founded<5, stores = young ? 3+Math.floor(R()*25) : 15+Math.floor(R()*180);
  const pv = (lo,hi)=>r1(lo+R()*(hi-lo));
  const p = {fin: young && R()<.5 ? null : pv(3.8,8.6), mom:pv(3.5,9.2), cus:pv(5,9), mall:pv(3.5,8.2), buzz:pv(3,8.8)};
  const open12 = Math.round(stores*(p.mom/25)), close12 = Math.round(stores*((10-p.mom)/40));

  const flags = [];

  if(pat!=null && pat<0 && p.fin<5) flags.push({sev:'watch',t:'Loss-making in FY25',d:`Net loss of ${inr(-pat)} on ${inr(rev)} revenue.`});
  const sub = SUBS[cat][Math.floor(R()*SUBS[cat].length)];

    own: R()<.6?'Founder-led':'Corporate', stores, cities:Math.max(1,Math.round(stores/4)), malls:Math.max(1,Math.round(stores*.35)), tenure:r1(young?0.8+R()*1.5:2+R()*4), exits:Math.floor(R()*4),
    open12, close12, rating:r1(3.6+R()*1.1), reviews:Math.round(stores*(200+R()*900)), rev, pat, funding: young?'₹'+(10+Math.floor(R()*80))+' Cr · Seed/Series A':'Private', lastRaise: young?6+Math.floor(R()*20):null,

function niceTicks(lo,hi,n=4){ const span=hi-lo, step0=span/n, mag=10**Math.floor(Math.log10(step0)), step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=step0); const out=[]; for(let v=Math.ceil(lo/step)*step; v<=hi+1e-9; v+=step) out.push(r1(v)); return out }
// Monotone cubic curve through [x,y] points (same slopes as d3.curveMonotoneX)
function smoothPath(pts){
  const n = pts.length;
  if(n < 3) return pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');
  const h = [], s = [], t = new Array(n);
  for(let i=0;i<n-1;i++){ h[i] = pts[i+1][0]-pts[i][0]; s[i] = (pts[i+1][1]-pts[i][1]) / h[i]; }
  for(let i=1;i<n-1;i++){ const p = (s[i-1]*h[i] + s[i]*h[i-1]) / (h[i-1]+h[i]); t[i] = (Math.sign(s[i-1])+Math.sign(s[i])) * Math.min(Math.abs(s[i-1]), Math.abs(s[i]), .5*Math.abs(p)) || 0; }
  t[0] = (3*s[0] - t[1]) / 2; t[n-1] = (3*s[n-2] - t[n-2]) / 2;
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for(let i=0;i<n-1;i++){ const k = h[i]/3; d += ` C${pts[i][0]+k} ${pts[i][1]+k*t[i]} ${pts[i+1][0]-k} ${pts[i+1][1]-k*t[i+1]} ${pts[i+1][0]} ${pts[i+1][1]}`; }
  return d;
}
const legendHtml = items => `<div class="chart-legend">${items.map(s=>`<span><i class="${s.kind||''}" style="--c:${s.color}"></i>${esc(s.label)}</span>`).join('')}</div>`;

// series: [{label, color, values, dashed}]; value axis on the right, labels in 12px Inter
function lineChart(series, {labels, h=220, ymin, ymax, fmt=f1, tick=t=>String(t), markers=[], legend=series.length>1}={}){
  const leg = legend ? legendHtml(series.map(s=>({label:s.label, color:s.color, kind:s.dashed?'dash':''}))) : '';
  return leg + chartHost((el, W) => {
    const gut = 40, axis = 26, pt = 10, pw = W - gut, ph = h - axis - pt;
    const all = series.flatMap(s=>s.values.filter(v=>v!=null));
    const lo = ymin ?? Math.floor(Math.min(...all) - .5), hi = ymax ?? Math.ceil(Math.max(...all) + .5);
    const n = labels.length, X = i => n===1 ? pw/2 : 1 + i*(pw-2)/(n-1), Y = v => pt + ph - (v-lo)/(hi-lo)*ph;
    let g = niceTicks(lo, hi, 4).filter(t=>t>=lo-1e-9 && t<=hi+1e-9).map(t=>`<line x1="0" x2="${pw}" y1="${Y(t)}" y2="${Y(t)}" style="stroke:var(--${Math.abs(t-lo)<1e-9?'border-strong':'border'})" shape-rendering="crispEdges"/><text x="${pw+10}" y="${Y(t)+4}">${esc(tick(t))}</text>`).join('');
    const room = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(pw/64))));
    labels.forEach((l,i)=>{ if(i%room===0) g += `<text x="${X(i)}" y="${h-6}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}">${esc(l)}</text>` });
    markers.forEach(m=>{ g += `<line x1="${X(m.i)}" x2="${X(m.i)}" y1="${pt}" y2="${pt+ph}" style="stroke:var(--danger)" stroke-dasharray="3 3"/><text x="${X(m.i)+6}" y="${pt+12}" style="fill:var(--danger)">${esc(m.label)}</text>` });
    const solid = series.filter(s=>!s.dashed);
    series.forEach(s=>{
      const pts = s.values.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean); if(!pts.length) return;
      const d = smoothPath(pts);
      if(!s.dashed && solid.length===1) g += `<path d="${d} L${pts.at(-1)[0]} ${pt+ph} L${pts[0][0]} ${pt+ph} Z" style="fill:color-mix(in oklab, ${s.color} 9%, transparent)"/>`;
      g += `<path d="${d}" fill="none" style="stroke:${s.color}" stroke-width="${s.dashed?1.75:2}"${s.dashed?' stroke-dasharray="4 5"':''} stroke-linecap="round" stroke-linejoin="round"/>`;
      if(!s.dashed) g += `<circle cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="3.5" style="fill:${s.color};stroke:var(--surface)" stroke-width="2"/>`;
    });
    g += `<g class="hov" style="display:none"><line class="cx" y1="${pt}" y2="${pt+ph}" style="stroke:var(--border-strong)" shape-rendering="crispEdges"/>${series.map((s,k)=>`<circle class="cd" data-k="${k}" r="4" style="fill:${s.color};stroke:var(--surface)" stroke-width="2"/>`).join('')}</g>`;
    g += `<rect class="scrub" x="0" y="0" width="${pw}" height="${pt+ph}" fill="transparent"/>`;
    el.innerHTML = `<svg width="${W}" height="${h}" viewBox="0 0 ${W} ${h}" role="img" aria-label="${esc(series.map(s=>s.label).join(', '))}">${g}</svg>`;
    const svg = el.firstChild, hov = svg.querySelector('.hov'), cx = hov.querySelector('.cx');
    const move = e => {
      const r = svg.getBoundingClientRect(), i = clamp(Math.round((e.clientX - r.left - 1) / ((pw-2) / Math.max(n-1,1))), 0, n-1);
      hov.style.display = ''; cx.setAttribute('x1', X(i)); cx.setAttribute('x2', X(i));
      hov.querySelectorAll('.cd').forEach(c=>{ const v = series[+c.dataset.k].values[i]; c.style.display = v==null?'none':''; if(v!=null){ c.setAttribute('cx', X(i)); c.setAttribute('cy', Y(v)) } });
      showTip(tipHtml(labels[i], series.map(s=>({c:s.color, dash:s.dashed, name:s.label, val:s.values[i]==null?'—':fmt(s.values[i])}))), e.clientX, e.clientY);
    };
    const rect = svg.querySelector('.scrub');
    rect.addEventListener('pointermove', move); rect.addEventListener('pointerdown', move);
    rect.addEventListener('pointerleave', () => { hov.style.display = 'none'; hideTip() });
  }, h);
}
// bar from baseline y0 extending len px in dir (-1 up, 1 down); 4px rounded data-end, square at baseline
function barPath(x,y0,len,bw,dir,fill){
  const r = Math.min(4, len, bw/2), y1 = y0 + dir*len;
  return `<path d="M${x} ${y0} V${y1-dir*r} Q${x} ${y1} ${x+r} ${y1} H${x+bw-r} Q${x+bw} ${y1} ${x+bw} ${y1-dir*r} V${y0} Z" style="fill:${fill}"/>`;
}
// Opened (up, green) vs closed (down, red) per quarter, values at the bar ends
function storeBars(qs, {h=210}={}){
  return legendHtml([{label:'Opened',color:'var(--success)',kind:'sq'},{label:'Closed',color:'var(--danger)',kind:'sq'}]) + chartHost((el, W) => {
    const axis = 24, pad = 18, ph = h - axis - pad*2, mid = pad + ph/2;
    const m = Math.max(1, ...qs.map(q=>Math.max(q.open,q.close)));
    const slot = W/qs.length, bw = Math.min(24, slot*.45), Y = v => Math.max(2, v/m*(ph/2)), every = slot < 50 ? 2 : 1;
    let g = `<line x1="0" x2="${W}" y1="${mid}" y2="${mid}" style="stroke:var(--border-strong)" shape-rendering="crispEdges"/>`;
    qs.forEach((q,i)=>{
      const cx = slot*(i+.5), x = cx - bw/2;
      if(q.open){ g += barPath(x, mid-1, Y(q.open), bw, -1, 'var(--success)'); g += `<text x="${cx}" y="${mid-1-Y(q.open)-6}" text-anchor="middle">${q.open}</text>` }
      if(q.close){ g += barPath(x, mid+1, Y(q.close), bw, 1, 'var(--danger)'); g += `<text x="${cx}" y="${mid+1+Y(q.close)+14}" text-anchor="middle">${q.close}</text>` }
      if(i%every===0 || i===qs.length-1) g += `<text x="${cx}" y="${h-5}" text-anchor="middle">${esc(q.q)}</text>`;
      const net = q.open - q.close;
      g += `<rect x="${slot*i}" y="0" width="${slot}" height="${h-axis}" fill="transparent" data-tip="${esc(tipHtml(q.q, [{c:'var(--success)',name:'Opened',val:String(q.open)},{c:'var(--danger)',name:'Closed',val:String(q.close)},{name:'Net change',val:(net>=0?'+':'')+net}]))}"/>`;
    });
    el.innerHTML = `<svg width="${W}" height="${h}" viewBox="0 0 ${W} ${h}" role="img" aria-label="Stores opened and closed per quarter">${g}</svg>`;
  }, h);
}
// Small gray trend line; the end dot marks today
function sparkline(vals, {w=72, h=24}={}){
  const lo = Math.min(...vals), hi = Math.max(...vals), X = i => 2 + i*(w-6)/(vals.length-1), Y = v => h - 3 - (hi===lo ? .5 : (v-lo)/(hi-lo))*(h-7);

}

function runResearch(el, b){
  const fnb = FNB.has(b.cat);
  const steps = [
    {t:'Identify the brand',src:'Company registry, brand website',facts:[b.sub, `HQ ${b.hq}`, `Parent: ${b.parent}`, `Founded ${b.founded}`]},
    {t:'Company filings',src:'MCA filings, stock exchange reports',facts: b.rev!=null ? [`FY25 revenue ${inr(b.rev)}`, `Net ${b.pat<0?'loss':'profit'} ${inr(Math.abs(b.pat))}`] : ['No public filings, pillar skipped'], drop: b.rev!=null ? '“Valued at ₹2,000 Cr” (blog post, no source)' : null},
    {t:'Funding and ownership',src:'Startup databases, press releases',facts:[b.funding, b.own].concat(b.lastRaise?[`Last raise ${b.lastRaise} months ago`]:[])},
    {t:'Store footprint',src:'Google Maps, brand store locator, monthly snapshots',facts:[`${b.stores} stores`, `${b.cities} cities`, `+${b.open12} opened, −${b.close12} closed in 12 months`]},
    {t:'Customer reviews',src: fnb ? 'Google reviews, Zomato' : 'Google reviews',facts:[`${b.rating.toFixed(1)}★ average`, `${b.reviews.toLocaleString('en-IN')} reviews`, b.id==='softstep'?'Review spike flagged':'No unusual review spikes']},
    {t:'Mall track record',src:'Mall directories, lease registrations',facts:[`In ${b.malls} malls`, `Average stay ${b.tenure.toFixed(1)} years`, `${b.exits} exits in 3 years`]},
    {t:'Press and social',src:'Indian business press, Instagram',facts:[`${b.articles90} articles in 90 days`, `${compact(b.igFollowers)} Instagram followers`], drop:'“Opening 50 stores this year” (reel, no source)'},
    {t:'Score with the fixed formula',src:'No AI here. The same formula for every brand.',facts:[`Peer group: ${CATS[b.cat].label}`, isYoung(b)?'Young-brand weights applied':'Standard weights', `Score ${f1(score(b))} / 10`]}
  ];
  el.innerHTML = `
  <header class="ph">
    <div class="crumbs"><span>Research</span><span class="dot-sep">/</span><span class="here">Step 2 of 2 · Collecting facts</span></div>
    <div class="title-row">${badge(b,48)}<h1 class="page-title">${esc(b.name)}</h1><div class="actions"><button class="btn btn-secondary btn-sm" id="skip">Skip to result</button></div></div>
  </header>
  <div class="grid-2 wide">
    <section class="card">${cardHead('What the agent found','Each source is read in turn')}<ol class="steps">${steps.map((s,i)=>`<li class="wait" data-i="${i}"><span class="st"></span><div style="min-width:0"><div class="w5">${esc(s.t)}</div><div class="muted xs">${esc(s.src)}</div><div class="facts"></div></div><span class="note muted xs" data-n></span></li>`).join('')}</ol></section>
    <aside class="card stack" style="gap:var(--space-5)">
      <div><div class="card-title">How this works</div><p class="secondary" style="margin-top:6px">The AI only collects facts. Each fact must come with a link and a date, or it is thrown out. A fixed formula turns the facts into the score, so the same facts always give the same score.</p></div>
      <div class="kv" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div><span>Sources</span><b id="c-src">0</b></div><div><span>Facts kept</span><b id="c-keep">0</b></div><div><span>Thrown out</span><b id="c-drop">0</b></div></div>
      <div class="callout">Facts refresh monthly. The store counts we record every month build a history nobody else can recreate later.</div>
    </aside>
  </div>`;
  let i = 0, src = 0, keep = 0, drop = 0;
  const finish = () => { if(!$('#skip')) return; clearInterval(route.timer); state.researched.add(b.id); saveState(); toast(`${b.name} added to the index`); go('brand/'+b.id) };
  $('#skip').onclick = finish;
  const tick = () => {
    if(i>0){ const prev = $(`.steps li[data-i="${i-1}"]`); prev.classList.remove('run'); prev.classList.add('done'); prev.querySelector('.st').innerHTML = ic('check') }
    if(i>=steps.length){ clearInterval(route.timer); setTimeout(finish, 700); return }
    const s = steps[i], row = $(`.steps li[data-i="${i}"]`); row.classList.remove('wait'); row.classList.add('run');
    const box = row.querySelector('.facts');
    s.facts.forEach((f,j)=>setTimeout(()=>{ if(box.isConnected) box.insertAdjacentHTML('beforeend',`<span class="badge">${esc(f)}</span>`) }, j*140));
    if(s.drop) setTimeout(()=>{ if(!box.isConnected) return; box.insertAdjacentHTML('beforeend',`<span class="badge drop" title="Thrown out: no source">${esc(s.drop)}</span>`); drop++; $('#c-drop').textContent=drop }, s.facts.length*140+80);
    const n = 1 + Math.floor(rng(hash(b.id+i))()*5) + (i===3?3:0);
    src += n; keep += s.facts.length; row.querySelector('[data-n]').textContent = i<steps.length-1 ? `${n} sources` : '';
    $('#c-src').textContent = src; $('#c-keep').textContent = keep;
    i++;
  };
  tick(); route.timer = setInterval(tick, 720);
}

function pillarWhy(b,k){
  switch(k){

    case 'mom': return `+${b.open12} opened, −${b.close12} closed in 12 months`;
    case 'cus': return `${b.rating.toFixed(1)}★ from ${compact(b.reviews)} reviews`;
    case 'mall': return `${b.malls} malls, average stay ${b.tenure.toFixed(1)} years, ${b.exits} exits`;
    case 'buzz': return `${b.articles90} articles in 90 days`;
  }
}
const peersOf = b => BRANDS.filter(x=>x.cat===b.cat && !x.generated && !x.closed);

  const plain = `LEASING NOTE: ${b.name}\n${MY_MALL.name}, ${MY_MALL.city} · ${today}\n\nBrand Index score: ${f1(s.score)}/10 (${bd.label}, confidence ${conf.k.toLowerCase()})\n${PILLARS.map(p=>`- ${p.label}: ${f1(b.p[p.k])}`).join('\n')}\n\nSummary: ${b.summary}\nStrengths: ${top.map(p=>p.label+' ('+pillarWhy(b,p.k)+')').join('; ')}\nRisks: ${risks.length?risks.map(f=>f.t).join('; '):'No red flags found'}\n\nRecommendation: ${rec}\n\nBased on ${b.evidence.length} sourced facts. Prototype data, illustrative only.`;

      <div class="callout"><b>Recommendation.</b> ${esc(rec)}</div>
      <p class="muted xs">${bandPill(s.score)} Confidence ${conf.k.toLowerCase()} · ${b.evidence.length} sourced facts · ${esc(PRESETS[state.preset]?.label||'Custom')} weights · prototype data, illustrative only</p>

      <div class="cmp-row" style="align-items:start"><span class="lab">Summary</span>${bs.map(b=>`<p class="secondary">${esc(b.summary)}</p>`).join('')}</div>

function hypeScatter(list){
  const H = 440;
  return legendHtml(Object.values(QUAD).map(q=>({label:q.label,color:q.color,kind:'dot'}))) + chartHost((el, W) => {
    const gut = 36, axis = 40, pt = 10, pr = 10, pw = W-gut-pr, ph = H-axis-pt, lo = 2, hi = 10;
    const X = v => gut + (v-lo)/(hi-lo)*pw, Y = v => pt + ph - (v-lo)/(hi-lo)*ph;
    let g = '';
    [2,4,6,8,10].forEach(t=>{ g += `<line x1="${gut}" x2="${gut+pw}" y1="${Y(t)}" y2="${Y(t)}" style="stroke:var(--${t===2?'border-strong':'border'})" shape-rendering="crispEdges"/><text x="${gut-10}" y="${Y(t)+4}" text-anchor="end">${t}</text><text x="${X(t)}" y="${pt+ph+18}" text-anchor="middle">${t}</text>` });
    g += `<line x1="${X(6.5)}" x2="${X(6.5)}" y1="${pt}" y2="${pt+ph}" style="stroke:var(--border-strong)" stroke-dasharray="4 4"/><line x1="${gut}" x2="${gut+pw}" y1="${Y(6.6)}" y2="${Y(6.6)}" style="stroke:var(--border-strong)" stroke-dasharray="4 4"/>`;
    const ql = (x,y,a,t) => `<text x="${x}" y="${y}" text-anchor="${a}" style="fill:var(--text-secondary);font-weight:500">${t}</text>`;
    g += ql(gut+8, pt+16, 'start', 'Hidden gems') + ql(gut+pw-8, pt+16, 'end', 'Proven stars') + ql(gut+pw-8, pt+ph-10, 'end', 'Overhyped') + ql(gut+8, pt+ph-10, 'start', 'Weak');
    g += `<text x="${gut+pw/2}" y="${H-4}" text-anchor="middle">Buzz, from press and social →</text><text transform="translate(10 ${pt+ph/2}) rotate(-90)" text-anchor="middle">Fundamentals, score without buzz →</text>`;
    // label gems and overhyped brands, skipping labels that would collide
    const placed = list.map(b=>({x:X(b.p.buzz)-6, y:Y(fundamentals(b))-6, w:12, h:12})), hits = a => placed.some(p=>a.x<p.x+p.w && a.x+a.w>p.x && a.y<p.y+p.h && a.y+a.h>p.y);
    const pri = b => quadrant(b)==='gem' ? fundamentals(b)-b.p.buzz : quadrant(b)==='hype' ? b.p.buzz-fundamentals(b) : -99, labels = {};
    [...list].filter(b=>['gem','hype'].includes(quadrant(b))).sort((a,c)=>pri(c)-pri(a)).forEach(b=>{
      const x = X(b.p.buzz), y = Y(fundamentals(b)), w = b.name.length*6.6;
      for(const box of [{x:x+10,y:y-8,w,h:14,a:'start'},{x:x-10-w,y:y-8,w,h:14,a:'end'},{x:x-w/2,y:y-24,w,h:14,a:'middle'}])
        if(box.x>=gut && box.x+box.w<=gut+pw && !hits(box)){ placed.push(box); labels[b.id]=box; break }
    });
    list.forEach(b=>{ const q = quadrant(b), x = X(b.p.buzz), y = Y(fundamentals(b)), L = labels[b.id];
      g += `<g data-brand="${b.id}" style="cursor:pointer" data-tip="${esc(tipHtml(b.name, [{c:QUAD[q].color,name:'Fundamentals',val:f1(fundamentals(b))},{name:'Buzz',val:f1(b.p.buzz)}], QUAD[q].label))}"><circle cx="${x}" cy="${y}" r="13" fill="transparent"/><circle cx="${x}" cy="${y}" r="5.5" style="fill:${QUAD[q].color};stroke:var(--surface)" stroke-width="2"/>${L?`<text x="${L.a==='start'?L.x:L.a==='end'?L.x+L.w:L.x+L.w/2}" y="${L.y+11}" text-anchor="${L.a}" style="fill:var(--foreground)">${esc(b.name)}</text>`:''}</g>` });
    el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Brands plotted by buzz and fundamentals">${g}</svg>`;
  }, H);
}

const monthsUntil = ym => { const [y,m] = ym.split('-').map(Number); return (y-2026)*12 + (m-10) };
function tenantAction(t){
  const b = brandOf(t.id), s = score(b), mo = monthsUntil(t.leaseEnds);
  if(s<5.5 && mo<=12) return {k:'badge-danger',t:'Plan a replacement',repl:true};
  if(s<5.5) return {k:'badge-danger',t:'Watch closely',repl:true};
  if(mo<=12 && b.d3<0) return {k:'badge-warning',t:'Renegotiate'};
  if(s>=7.5 && mo<=24) return {k:'badge-success',t:'Renew early'};
  return {k:'',t:'No action'};
}

    <div class="grid-2">
      <div>${cardHead('Brand Index score')}${lineChart([{label:'Score',color:'var(--chart-ink)',values:sc}],{labels:M,h:220,ymin:0,ymax:8,markers:[{i:9,label:'Falls below 5'}]})}</div>
      <div>${cardHead('Stores trading')}${lineChart([{label:'Stores',color:'var(--chart-ink)',values:stores}],{labels:M,h:220,ymin:0,ymax:150,fmt:v=>String(Math.round(v)),markers:[{i:9,label:'Score warning'}]})}</div>
    </div>
    <div class="callout">The score dropped into “Watch” in October 2022, while the chain still had 122 stores. That was <b>14 months before the last store closed</b>. The warning came from store closures and falling reviews, not the accounts, which lagged by a year.</div>
    <p class="muted xs">Illustrative numbers. In the real build, every known failure runs through the model and the weights are tuned until each one is flagged early.</p>
  </section>
  <section class="grid-2">
    <div class="card">${cardHead("What it doesn't know")}<ul class="list">${["Store-level sales. No brand publishes them.","Brands with almost no online footprint. They get a low-confidence score, or none.","Private deal terms. Lease-registration data helps in negotiation, not in judging the brand."].map(t=>`<li style="grid-template-columns:auto minmax(0,1fr)"><span class="sev">${ic('info')}</span><span class="secondary">${t}</span></li>`).join('')}</ul></div>
    <div class="card">${cardHead('Fair to the brands')}<ul class="list">${["Scores use sourced facts only, written in neutral language.","Behind a login, for leasing teams only.","Brands can ask for a correction if they bring a source."].map(t=>`<li style="grid-template-columns:auto minmax(0,1fr)"><span class="sev">${ic('shield')}</span><span class="secondary">${t}</span></li>`).join('')}</ul></div>
  </section>`;
};

// ---------- Start-up: tooltips, theme, delegated navigation, charts, segmented glide ----------
function glideSegs(){
  $$('.seg').forEach(seg=>{
    const b = seg.querySelector('button[aria-pressed="true"]');
    if(!b){ seg.style.setProperty('--w','0px'); return }
    seg.style.setProperty('--x', b.offsetLeft+'px'); seg.style.setProperty('--w', b.offsetWidth+'px');
    if(!seg.dataset.ready && b.offsetWidth) requestAnimationFrame(()=>seg.dataset.ready = '1');
  });
}
(function(){
  let tipFromAttr = false;
  document.addEventListener('mouseover', e=>{ const t = e.target.closest?.('[data-tip]'); if(t){ showTip(t.getAttribute('data-tip'), e.clientX, e.clientY); tipFromAttr = true } else if(tipFromAttr){ hideTip(); tipFromAttr = false } });
  document.addEventListener('mousemove', e=>{ if(tipFromAttr && !$('#tip').hidden) placeTip(e.clientX, e.clientY) });
  addEventListener('scroll', ()=>{ hideTip(); $('#topbar').toggleAttribute('data-scrolled', scrollY>4) }, {passive:true});
  const th = store.get('theme', null); if(th) document.documentElement.dataset.theme = th;
  $('#theme-btn').onclick = () => { const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); const nx = cur==='dark'?'light':'dark'; document.documentElement.dataset.theme = nx; store.set('theme', nx) };
  renderShell();
  bindSearch($('#top-q'), $('#top-sug'));
  document.addEventListener('keydown', e=>{ if(e.key==='/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); $('#top-q').focus() } });
  // one delegated handler for links, brand rows and route rows
  document.addEventListener('click', e=>{
    if(e.target.closest('.overlay .dialog') && !e.target.closest('a[href^="#"]')) return;
    const a = e.target.closest('a[href^="#"]');
    if(a){ if(e.metaKey||e.ctrlKey) return; e.preventDefault(); const r = decodeURIComponent(a.getAttribute('href').slice(1)); if(r){ $('.overlay')?.remove(); document.body.classList.remove('memo-open'); go(r) } return }
    if(e.target.closest('button:not([data-brand]):not([data-go]), input, select, textarea, label')) return;
    const row = e.target.closest('[data-brand], [data-go]'); if(!row) return;
    if(row.dataset.brand) openBrand(brandOf(row.dataset.brand)); else go(row.dataset.go);
  });
  document.addEventListener('keydown', e=>{ if(e.key!=='Enter') return; const row = e.target.closest?.('[data-brand][tabindex], [data-go][tabindex]'); if(!row) return; row.dataset.brand ? openBrand(brandOf(row.dataset.brand)) : go(row.dataset.go) });
  addEventListener('popstate', ()=>{ const h = decodeURIComponent(location.hash.slice(1)) || 'home'; if(h!==curRoute){ curRoute = h; navStack.pop(); route() } });
  // MutationObserver callbacks are already batched; no animation-frame wait, so charts also draw in background tabs
  new MutationObserver(()=>{ hydrateCharts(); glideSegs() })
    .observe($('#view'), {childList:true, subtree:true, attributes:true, attributeFilter:['aria-pressed']});
  addEventListener('resize', glideSegs);
  document.fonts?.ready.then(glideSegs);
  route();
})();

</script>
